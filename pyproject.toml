[project]
name = "py-a2ui"
version = "0.2.0"
description = "Pythonic Pydantic wrapper for A2UI components"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Yitzhak Peleg", email = "yitzhak.peleg@gmail.com" }]
keywords = ["a2ui", "pydantic", "ui", "ai-agents", "google"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/YitzhakPeleg/py-a2ui"
Repository = "https://github.com/YitzhakPeleg/py-a2ui"
Issues = "https://github.com/YitzhakPeleg/py-a2ui/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "inline-snapshot>=0.10",
    "pytest-xdist>=3.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_a2ui"]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
